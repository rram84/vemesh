image: ubuntu:22.04

pipelines:
  default:
    - step:
        name: Build VEMesh (Linux)
        caches:
          - apt-cache
          - pmp
          - build
        script:
          # -------------------------------------------------
          # System setup (cached)
          # -------------------------------------------------
          - >
            if [ ! -f "$HOME/.apt-installed" ]; then
              echo "Installing system dependencies...";
              apt-get update -q;
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                cmake \
                git \
                libeigen3-dev \
                libboost-all-dev \
                libomp-dev \
                wget \
                unzip;
              touch $HOME/.apt-installed;
            else
              echo "Using cached system dependencies";
            fi

          # -------------------------------------------------
          # Build PMP (headless: no visualization, no tests/examples)
          # -------------------------------------------------
          - >
            if [ ! -d "$HOME/pmp/install" ]; then
              echo "Building PMP headless...";
              git clone --depth 1 https://github.com/pmp-library/pmp-library.git $HOME/pmp;
              mkdir -p $HOME/pmp/build;
              cd $HOME/pmp/build;
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/pmp/install \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                -DGLFW_BUILD_DOCS=OFF \
                -DGLFW_BUILD_EXAMPLES=OFF \
                -DGLFW_BUILD_TESTS=OFF \
                -DGLFW_INSTALL=OFF;
              cmake --build . --parallel;
              cmake --install .;
            else
              echo "Using cached PMP";
            fi

          # -------------------------------------------------
          # Build VEMesh
          # -------------------------------------------------
          - mkdir -p build
          - cd build
          - cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/pmp/install"
          - cmake --build . --parallel

definitions:
  caches:
    apt-cache: $HOME/.apt-installed
    pmp: $HOME/pmp
    build: build
