image: ubuntu:22.04

pipelines:
  default:
    - step:
        name: Build VEMesh (Linux)
        caches:
          - pmp
          - build
        script:
          # -------------------------------------------------
          # Set up Ubuntu repositories (needed in minimal images)
          # -------------------------------------------------
          - echo "deb http://archive.ubuntu.com/ubuntu jammy main universe multiverse restricted" > /etc/apt/sources.list
          - echo "deb http://archive.ubuntu.com/ubuntu jammy-updates main universe multiverse restricted" >> /etc/apt/sources.list
          - echo "deb http://archive.ubuntu.com/ubuntu jammy-security main universe multiverse restricted" >> /etc/apt/sources.list
          
          # Update and install system dependencies
          - apt-get update -q
          - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates \
              build-essential \
              cmake \
              git \
              libeigen3-dev \
              libboost-all-dev \
              libomp-dev \
              wget \
              unzip \
              pkg-config

          # -------------------------------------------------
          # Build PMP (headless) if not cached
          # -------------------------------------------------
          - |
            if [ ! -d "$HOME/pmp/install" ]; then
              echo "Building PMP headless..."
              git clone --depth 1 https://github.com/pmp-library/pmp-library.git $HOME/pmp
              mkdir -p $HOME/pmp/build
              cd $HOME/pmp/build
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/pmp/install \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                -DPMP_USE_GLFW=OFF
              make -j$(nproc)
              make install
            else
              echo "Using cached PMP"
            fi

          # -------------------------------------------------
          # Build VEMesh
          # -------------------------------------------------
          - mkdir -p $HOME/vemesh/build
          - cd $HOME/vemesh/build
          - cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/pmp/install"
          - make -j$(nproc)

definitions:
  caches:
    # PMP build and install
    pmp: $HOME/pmp
    # VEMesh build folder
    build: $HOME/vemesh/build
