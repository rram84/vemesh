image: ghcr.io/cpp-dev/ubuntu:22.04

pipelines:
  default:
    - step:
        name: Build VEMesh (Linux)
        caches:
          - pmp
          - build
        script:
          # -------------------------------------------------
          # Confirm environment
          # -------------------------------------------------
          - echo "Using image: $(cat /etc/os-release | grep PRETTY_NAME)"
          - git --version
          - cmake --version
          - g++ --version

          # -------------------------------------------------
          # Build PMP headless if not cached
          # -------------------------------------------------
          - |
            if [ ! -d "$HOME/pmp/install" ]; then
              echo "Building PMP headless..."
              git clone --depth 1 https://github.com/pmp-library/pmp-library.git $HOME/pmp
              mkdir -p $HOME/pmp/build
              cd $HOME/pmp/build
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/pmp/install \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                -DPMP_USE_GLFW=OFF
              make -j$(nproc)
              make install
            else
              echo "Using cached PMP"
            fi

          # -------------------------------------------------
          # Build VEMesh
          # -------------------------------------------------
          - mkdir -p $HOME/vemesh/build
          - cd $HOME/vemesh/build
          - cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/pmp/install"
          - make -j$(nproc)

definitions:
  caches:
    # Cache PMP install to avoid rebuilding
    pmp: $HOME/pmp
    # Cache VEMesh build directory
    build: $HOME/vemesh/build
