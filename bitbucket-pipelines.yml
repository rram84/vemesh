image: ghcr.io/cpp-dev/ubuntu:22.04

pipelines:
  default:
    - step:
        name: Build VEMesh
        caches:
          - pmp
          - build
        script:
          - |
            echo "Confirming environment..."
            grep PRETTY_NAME /etc/os-release
            git --version
            cmake --version
            g++ --version

          # -------------------------------------------------
          # Build or download PMP headless
          # -------------------------------------------------
          - |
            if [ ! -d "$HOME/pmp/install" ]; then
              echo "Downloading prebuilt PMP release..."
              mkdir -p $HOME/pmp
              cd $HOME/pmp
              wget -q https://github.com/pmp-library/pmp-library/releases/latest/download/pmp-library.tar.gz -O pmp-library.tar.gz
              tar -xzf pmp-library.tar.gz
              mkdir -p build
              cd build
              cmake ../pmp-library \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/pmp/install \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                -DPMP_USE_GLFW=OFF
              make -j$(nproc)
              make install
            else
              echo "Using cached PMP"
            fi

          # -------------------------------------------------
          # Build VEMesh
          # -------------------------------------------------
          - mkdir -p $HOME/vemesh/build
          - cd $HOME/vemesh/build
          - cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/pmp/install"
          - make -j$(nproc)

definitions:
  caches:
    pmp: $HOME/pmp
    build: $HOME/vemesh/build
