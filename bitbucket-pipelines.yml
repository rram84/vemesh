image: ubuntu:22.04

pipelines:
  default:
    - step:
        name: Build VEMesh
        caches:
          - pmp
          - build
        script:
          # Update package list
          - apt-get update -q
          # Install only missing packages
          - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libeigen3-dev \
              libboost-all-dev \
              libomp-dev \
              unzip \
              pkg-config

          # PMP build
          - |
            if [ ! -d "$HOME/pmp/install" ]; then
              echo "Building PMP headless..."
              git clone --depth 1 https://github.com/pmp-library/pmp-library.git $HOME/pmp
              mkdir -p $HOME/pmp/build
              cd $HOME/pmp/build
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/pmp/install \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                -DPMP_USE_GLFW=OFF
              make -j$(nproc)
              make install
            else
              echo "Using cached PMP"
            fi

          # VEMesh build
          - mkdir -p $HOME/vemesh/build
          - cd $HOME/vemesh/build
          - cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/pmp/install"
          - make -j$(nproc)

definitions:
  caches:
    pmp: $HOME/pmp
    build: $HOME/vemesh/build
