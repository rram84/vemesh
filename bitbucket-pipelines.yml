image: ubuntu:22.04

pipelines:
  default:
    - step:
        name: Build VEMesh (Linux)
        caches:
          - apt
          - pmp
          - build
        script:
          # -------------------------------------------------
          # System setup
          # -------------------------------------------------
          - apt-get update -q
          - apt-get install -y --no-install-recommends \
              ca-certificates \
              build-essential \
              cmake \
              git \
              libeigen3-dev \
              libboost-all-dev \
              libomp-dev \
              wget \
              unzip \
              pkg-config

          # -------------------------------------------------
          # Build and cache PMP (headless)
          # -------------------------------------------------
          - |
            if [ ! -d "$HOME/pmp/install" ]; then
              echo "Building PMP headless..."
              git clone --depth 1 https://github.com/pmp-library/pmp-library.git $HOME/pmp
              mkdir -p $HOME/pmp/build
              cd $HOME/pmp/build
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/pmp/install \
                -DBUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_DOCS=OFF \
                -DPMP_USE_GLFW=OFF
              make -j$(nproc)
              make install
            else
              echo "Using cached PMP"
            fi

          # -------------------------------------------------
          # Build VEMesh
          # -------------------------------------------------
          - mkdir -p $HOME/vemesh/build
          - cd $HOME/vemesh/build
          - cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/pmp/install"
          - make -j$(nproc)

definitions:
  caches:
    apt: /var/cache/apt
    pmp: $HOME/pmp
    build: $HOME/vemesh/build
